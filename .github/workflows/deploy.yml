name: Frontend Deploy

on:
  workflow_run:
    workflows: ["Frontend CI"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: >
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build
        env:
          VITE_API_URL: https://api.nopressurewear.rs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::851587047309:role/NoPressureWearFrontendGitHubDeployRole
          aws-region: eu-north-1

      - name: Sync build to S3
        run: |
          aws s3 sync dist/ s3://nopressurewear-frontend-851587047309-eu-north-1-an/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1L5WMNC9N1F8N \
            --paths "/*"
